services:
  db:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_USER: wetland
      POSTGRES_PASSWORD: wetland
      POSTGRES_DB: wetland
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wetland -d wetland"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5433:5432"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://wetland:wetland@db:5432/wetland
      WETLAND_API_KEY: dev-api-key
      WETLAND_ALLOW_RESET: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  dbdata:
